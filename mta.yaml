_schema-version: "3.2"
ID: project2
description: Generated by Fiori Tools
version: 0.0.1
modules:

- name: project2-destination-content
  type: com.sap.application.content
  requires:
  - name: project2-destination-service
    parameters:
      content-target: true
  - name: project2-repo-host
    parameters:
      service-key:
        name: project2-repo-host-key
  - name: project2-uaa
    parameters:
      service-key:
        name: project2-uaa-key
  - name: project2-html5-runtime
    parameters:
      service-key:
        name: project2-html5-runtime-key
  parameters:
    content:
      subaccount:
        existing_destinations_policy: update
        destinations:
          - Name: project2-cdm
            Description: Destination for Workzone configuration
            ServiceInstanceName: project2-html5-runtime
            ServiceKeyName: project2-html5-runtime-key
            URL: https://html5-apps-repo-rt.${default-domain}/applications/cdm/project2
      instance:
        destinations:
        - Name: project2_html_repo_host
          ServiceInstanceName: project2-html5-service
          ServiceKeyName: project2-repo-host-key
          sap.cloud.service: project2
        - Authentication: OAuth2UserTokenExchange
          Name: project2_uaa
          ServiceInstanceName: project2-xsuaa-service
          ServiceKeyName: project2-uaa-key
          sap.cloud.service: project2
        existing_destinations_policy: update
  build-parameters:
    no-source: true

- name: project2-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: project2-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - project2.zip
      name: project2
      target-path: resources/

- name: project2
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

- name: project2-router
  type: approuter.nodejs
  path: app/router
  parameters:
    keep-existing-routes: true
    disk-quota: 512M
    memory: 512M
    routes: 
      - route: '*-project2-mycompany.${default-domain}' 
  properties:
    TENANT_HOST_PATTERN: "^(.*)-project2-mycompany.${default-domain}" 
  requires:
  - name: project2-uaa
  - name: project2-html5-runtime
  - name: project2-destination-service
  provides: 
  - name: app-api
    properties:
      redirect-uris: ${protocol}://*-project2-mycompany.${default-domain}/**

- name: project2-callback-srv
  type: nodejs
  path: app/srv
  properties:
    DEFAULT_DOMAIN: ${default-domain} 
  provides:
  - name: callback-api
    properties:
      url: ${default-url}
  requires:
  - name: project2-uaa
resources:

- name: project2-saas-registry
  type: org.cloudfoundry.managed-service
  requires:
  - name: callback-api
  parameters:
    service: saas-registry
    service-plan: application
    config:
      xsappname: project2
      appName: project2
      displayName: "My Multitenant Fiori App"
      description: "SaaS Application"
      category: "Custom Apps"
      appUrls:
        onSubscription: ~{callback-api/url}/callback/v1.0/tenants/{tenantId}

- name: project2-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: project2-destination-service
    service-plan: lite

- name: project2-uaa
  type: org.cloudfoundry.managed-service
  requires:
    - name: app-api
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: project2-xsuaa-service
    service-plan: broker
    config:
      xsappname: project2
      tenant-mode: shared
      oauth2-configuration:
        redirect-uris:
          - ~{app-api/redirect-uris}

- name: project2-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: project2-html5-service
    service-plan: app-host

- name: project2-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
