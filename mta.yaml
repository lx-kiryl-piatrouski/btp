_schema-version: "3.2"
ID: project2
description: Generated by Fiori Tools
version: 0.0.1

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

modules:
- name: project2-destination-content
  type: com.sap.application.content
  requires:
  - name: project2-destination-service
    parameters:
      content-target: true
  - name: project2-repo-host
    parameters:
      service-key:
        name: project2-repo-host-key
  - name: project2-html5-runtime
    parameters:
      service-key:
        name: project2-html5-runtime-key
  - name: project2-uaa 
    parameters:
      service-key:
        name: project2-uaa-key
  parameters:
    content:
      subaccount:
        existing_destinations_policy: update
        destinations:
          - Name: project2-cdm
            Description: Destination for Workzone configuration
            ServiceInstanceName: project2-html5-runtime
            ServiceKeyName: project2-html5-runtime-key
            URL: https://html5-apps-repo-rt.${default-domain}/applications/cdm/project2
      instance:
        existing_destinations_policy: update
        destinations:
        - Name: project2_html5_runtime
          ServiceInstanceName: project2-html5-service 
          ServiceKeyName: project2-repo-host-key
          sap.cloud.service: project2
        - Authentication: OAuth2UserTokenExchange 
          Name: project2_uaa
          ServiceInstanceName: project2-xsuaa-service 
          ServiceKeyName: project2-uaa-key
          sap.cloud.service: project2
  build-parameters:
    no-source: true

- name: project2-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: project2-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - project2.zip
      name: project2
      target-path: resources/

- name: project2
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

- name: project2-router
  type: approuter.nodejs
  path: app/router
  parameters:
    keep-existing-routes: true
    disk-quota: 512M
    memory: 512M
  properties:
    TENANT_HOST_PATTERN: "^(.*)-project2-mycompany.${default-domain}"
    CORS:
      - uriPattern: .*
        allowedOrigin:
          - host: '*-project2-mycompany.${default-domain}'
            protocol: 'https'
  requires:
  - name: project2-uaa
  - name: project2-connectivity 
  - name: project2-html5-runtime
  - name: project2-destination-service
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: project2-mycompany.${default-domain}
      redirect-uris: ${protocol}://*-project2-mycompany.${default-domain}/**

- name: project2-mtx
  type: nodejs
  path: app/mtx
  parameters:
    memory: 256M
    disk-quota: 512M
  provides:
  - name: mtx-api
    properties:
      mtx-url: ${default-url}
  requires:
  - name: project2-uaa
  - name: project2-db
  - name: project2-html5-runtime
  - name: project2-connectivity    
  - name: project2-destination-service
  - name: project2-saas-registry  
  - name: app-api
    properties:
      SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-project2-mycompany.${default-domain}

resources:
- name: project2-saas-registry
  type: org.cloudfoundry.managed-service
  requires:
  - name: mtx-api
  parameters:
    service: saas-registry
    service-plan: application
    config:
      xsappname: project2-${org}-${space}
      appName: project2-${org}-${space}
      displayName: "My Multitenant Fiori App"
      description: "SaaS Application"
      category: "Custom Apps"
      appUrls:
        getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
        onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
        onSubscriptionAsync: false
        onUnSubscriptionAsync: false
        onUpdateDependenciesAsync: false

- name: project2-db
  type: org.cloudfoundry.managed-service
  parameters:
    service: service-manager
    service-plan: container

- name: project2-destination-service
  type: org.cloudfoundry.managed-service
  requires:
    - name: project2-uaa 
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          existing_destinations_policy: update
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
      version: 1.0.0
    service: destination
    service-name: project2-destination-service
    service-plan: lite

- name: project2-uaa
  type: org.cloudfoundry.managed-service
  requires:
    - name: app-api
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: project2-xsuaa-service
    service-plan: broker
    config:
      xsappname: project2-${org}-${space}
      tenant-mode: shared
      oauth2-configuration:
        redirect-uris:
          - ~{app-api/redirect-uris}

- name: project2-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: project2-html5-service
    service-plan: app-host

- name: project2-html5-runtime
  type: org.cloudfoundry.managed-service
  requires:
    - name: project2-uaa 
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime

- name: project2-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite